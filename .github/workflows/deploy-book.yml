name: deploy-book

on:
  workflow_run:
    workflows: ["Update Metadata"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: '.python-version'
        cache: pip

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Install SPARQL Kernel
      run: |
        python -m sparqlkernel install --user
        jupyter kernelspec list

    - name: cache executed notebooks
      uses: actions/cache@v3
      with:
        path: _build/.jupyter_cache
        key: jupyter-book-cache-${{ hashFiles('requirements.txt') }}

    - name: Build the book
      run: |
        jupyter-book build .

    - name: Inject all metadata into HTML
      run: |
        python -m quadriga.metadata.inject_all_metadata
        echo "Injected all metadata (OpenGraph, JSON-LD, and RDF links) into HTML head"

    - name: Copy metadata files to build directory
      run: |
        cp quadriga-metadata.jsonld _build/html/quadriga-metadata.jsonld
        cp quadriga-metadata.rdf _build/html/quadriga-metadata.rdf
        echo "Copied metadata files to _build/html for discovery"

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5.0.0
      with:
        path: "_build/html"

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

